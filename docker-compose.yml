services:
  postgres:
    image: postgres:15-alpine
    container_name: ratingflix-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dockerpassword
      POSTGRES_DB: ratingflix
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: ratingflix-backend
    ports:
      - '3333:3333'
    env_file:
      - ./backend/.env
    environment:
      # Sobrescreve o valor de backend/.env (que aponta pra "localhost",
      # válido fora do Docker): dentro da rede do Compose, o Postgres é
      # alcançado pelo nome do serviço, não por localhost.
      DATABASE_URL: postgresql://postgres:dockerpassword@postgres:5432/ratingflix?schema=public
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    # Aplica migrations pendentes a cada subida (idempotente) antes de
    # iniciar o servidor — evita esquecer de rodar `prisma migrate deploy`
    # manualmente depois de puxar uma migration nova.
    command: sh -c "npx prisma migrate deploy && npm run dev"

  frontend:
    build: ./frontend
    container_name: ratingflix-frontend
    ports:
      - '3000:3000'
    environment:
      # Usada pelo navegador (fora de qualquer container) — precisa da porta
      # publicada no host.
      NEXT_PUBLIC_API_URL: http://localhost:3333
      # Usada só pelo código que roda dentro do próprio container do
      # frontend (Server Components) — o nome do serviço, não localhost.
      API_URL_INTERNAL: http://backend:3333
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
